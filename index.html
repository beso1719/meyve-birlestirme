<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍉 Meyve Birleştirme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <header class="topbar">
      <div class="card score-card">
        <span class="label">SKOR</span>
        <span id="score" class="value">0</span>
      </div>
      <h1 class="title">🍉 Meyve Birleştirme</h1>
      <div class="card best-card">
        <span class="label">REKOR</span>
        <span id="best" class="value">0</span>
      </div>
    </header>

    <div class="play-area">
      <div class="next-box">
        <span class="label">SIRADAKİ</span>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
      <div class="jar">
        <canvas id="game"></canvas>
      </div>
    </div>

    <p class="hint">Fareyle hareket ettir • Tıkla veya <b>Boşluk</b> ile bırak</p>
  </div>

  <!-- Oyun bitti ekranı -->
  <div id="gameover" class="overlay hidden">
    <div class="modal">
      <h2>Oyun Bitti!</h2>
      <p>Skorun: <b id="final-score">0</b></p>
      <p>Rekor: <b id="final-best">0</b></p>
      <button id="restart" class="btn">Tekrar Oyna</button>
    </div>
  </div>

  <script src="matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
