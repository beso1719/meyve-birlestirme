<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍉 Meyve Birleştirme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ANA MENÜ -->
  <section class="screen" id="screen-menu">
    <h1 class="big-title">🍉 Meyve<br>Birleştirme</h1>
    <div class="nick-row">
      <span class="label">Takma ad</span>
      <input id="nick" maxlength="20" placeholder="adını yaz" autocomplete="off">
    </div>
    <div class="menu-btns">
      <button class="btn big" data-go="campaign">🗺️ Kampanya</button>
      <button class="btn big" data-go="endless">♾️ Sonsuz Mod</button>
      <button class="btn big" data-go="duel">⚔️ Düello</button>
      <button class="btn big ghost" data-go="leaderboard">🏆 Skor Tablosu</button>
    </div>
    <p class="conn" id="conn-state"></p>
  </section>

  <!-- LEVEL SEÇİMİ -->
  <section class="screen hidden" id="screen-campaign">
    <div class="topnav"><button class="back" data-back>‹ Geri</button><h2>Kampanya</h2><span></span></div>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- DÜELLO -->
  <section class="screen hidden" id="screen-duel">
    <div class="topnav"><button class="back" data-back>‹ Geri</button><h2>⚔️ Düello</h2><span></span></div>
    <div class="duel-box">
      <button class="btn big" id="duel-create">🆕 Yeni Düello Oluştur</button>
      <p class="muted">Bir kod alırsın, rakibine yollarsın.</p>
      <div class="or">— veya —</div>
      <div class="join-row">
        <input id="duel-code" maxlength="5" placeholder="KOD" autocomplete="off">
        <button class="btn" id="duel-join">Katıl</button>
      </div>
      <div id="duel-info" class="duel-info hidden"></div>
    </div>
  </section>

  <!-- SKOR TABLOSU -->
  <section class="screen hidden" id="screen-leaderboard">
    <div class="topnav"><button class="back" data-back>‹ Geri</button><h2>🏆 Skor Tablosu</h2><span></span></div>
    <div class="tabs" id="lb-tabs">
      <button class="tab active" data-period="daily">Günlük</button>
      <button class="tab" data-period="weekly">Haftalık</button>
      <button class="tab" data-period="all">Tüm Zamanlar</button>
    </div>
    <ol id="lb-list" class="lb-list"></ol>
    <p class="muted center" id="lb-empty"></p>
  </section>

  <!-- OYUN -->
  <section class="screen hidden" id="screen-game">
    <div class="game-wrap">
      <header class="topbar">
        <button class="back small" data-back>‹</button>
        <div id="hud" class="hud"></div>
        <div class="card score-card"><span class="label">SKOR</span><span id="score" class="value">0</span></div>
      </header>
      <div class="play-area">
        <div class="next-box"><span class="label">SIRADAKİ</span><canvas id="next" width="80" height="80"></canvas></div>
        <div class="jar"><canvas id="game"></canvas></div>
      </div>
      <p class="hint">Hareket ettir • Tıkla veya <b>Boşluk</b> ile bırak</p>
    </div>
  </section>

</div>

<!-- SONUÇ -->
<div id="overlay" class="overlay hidden">
  <div class="modal" id="result-modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="matter.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="supabase-client.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
